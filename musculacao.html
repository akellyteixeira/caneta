<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon/favicon.png">
    <title>Canetinha | Musculação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="topo">
            <button class="menu-button" id="menuButton" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>
        <aside class="menu-lateral" id="menuLateral">
            <div class="menu-header">
                <h2>Menu</h2>
                <button class="fechar-menu" id="fecharMenu" aria-label="Fechar menu">
                    &times;
                </button>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="dose.html">Registrar aplicação</a></li>
                    <li><a href="alimentacao.html">Registrar alimentação</a></li>
                    <li><a href="peso.html">Registrar peso</a></li>
                    <li><a href="hidratacao.html">Hidratação</a></li>
                    <li><a href="musculacao.html">Musculação</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </nav>
        </aside>
        <main class="conteudo-musculacao">
            <h1>Musculação</h1>
            <p class="subtitulo-musculacao">
                Registre seus treinos e acompanhe seu histórico.
            </p>
            <section class="formulario-musculacao">
                <form id="formMusculacao">
                    <div class="campo-musculacao">
                        <label for="dataTreino">
                            Data
                        </label>
                        <input type="date" id="dataTreino" name="dataTreino" required>
                    </div>
                    <div class="campo-musculacao">
                        <label for="exercicio">
                            Exercício
                        </label>
                        <input type="text" id="exercicio" name="exercicio" placeholder="Ex.: Agachamento" required>
                 </div>
                    <div class="campo-musculacao">
                        <label for="carga">
                            Carga
                        </label>
                        <div class="input-musculacao">
                            <input type="number" id="carga" name="carga" placeholder="Ex.: 20" min="0" step="0.5"
                                required>
                            <span>kg</span>
                        </div>
                    </div>
                    <div class="campo-musculacao">
                        <label for="series">
                            Séries
                        </label>
                        <input type="number" id="series" name="series" placeholder="Ex.: 3" min="1" step="1" required>
                    </div>
                    <div class="campo-musculacao">
                        <label for="repeticoes">
                            Repetições
                        </label>
                        <input type="number" id="repeticoes" name="repeticoes" placeholder="Ex.: 12" min="1" step="1"
                            required>
                    </div>
                    <div class="campo-musculacao">
                        <label for="cardio">
                            Cardio
                        </label>
                        <div class="input-musculacao">
                            <input type="number" id="cardio" name="cardio" placeholder="Ex.: 20" min="0" step="1">
                            <span>min</span>
                        </div>
                    </div>
                    <button type="submit" class="botao-musculacao">
                        Registrar treino
                    </button>
                </form>
            </section>
            <section class="historico-musculacao">
                <h2>
                    Histórico dos últimos 14 dias
                </h2>
                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Exercício</th>
                                <th>Carga</th>
                                <th>Séries</th>
                                <th>Repetições</th>
                                <th>Cardio</th>
                            </tr>
                        </thead>
                        <tbody id="historico-musculacao-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script>
        const menuButton =
            document.getElementById("menuButton");
        const menuLateral =
            document.getElementById("menuLateral");
        const fecharMenu =
            document.getElementById("fecharMenu");
        menuButton.addEventListener("click", function () {
            menuLateral.classList.add("menu-aberto");
        });
        fecharMenu.addEventListener("click", function () {
            menuLateral.classList.remove("menu-aberto");
        });
        const formMusculacao =
            document.getElementById("formMusculacao");
        const historicoMusculacaoBody =
            document.getElementById(
                "historico-musculacao-body"
            );
        let historicoMusculacao =
            JSON.parse(
                localStorage.getItem(
                    "historicoMusculacao"
                )
            ) || [];
        function obterDataHoje() {
            const hoje = new Date();
            const ano =
                hoje.getFullYear();
            const mes =
                String(
                    hoje.getMonth() + 1
                ).padStart(2, "0");
            const dia =
                String(
                    hoje.getDate()
                ).padStart(2, "0");
            return `${ano}-${mes}-${dia}`;
        }
        function formatarData(data) {
            const partes =
                data.split("-");
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        formMusculacao.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
                const registro = {
                    data:
                        document.getElementById(
                            "dataTreino"
                        ).value,
                    exercicio:
                        document.getElementById(
                            "exercicio"
                        ).value,
                    carga:
                        document.getElementById(
                            "carga"
                        ).value,
                    series:
                        document.getElementById(
                            "series"
                        ).value,
                    repeticoes:
                        document.getElementById(
                            "repeticoes"
                        ).value,
                    cardio:
                        document.getElementById(
                            "cardio"
                        ).value || 0
                };
                historicoMusculacao.push(registro);
                localStorage.setItem(
                    "historicoMusculacao",
                    JSON.stringify(
                        historicoMusculacao
                    )
                );
                formMusculacao.reset();
                document.getElementById(
                    "dataTreino"
                ).value = obterDataHoje();
                atualizarHistorico();
            }
        );
        function atualizarHistorico() {
            historicoMusculacaoBody.innerHTML = "";
            const hoje = new Date();
            for (let i = 0; i < 14; i++) {
                const data =
                    new Date(hoje);
                data.setDate(
                    hoje.getDate() - i
                );
                const ano =
                    data.getFullYear();
                const mes =
                    String(
                        data.getMonth() + 1
                    ).padStart(2, "0");
                const dia =
                    String(
                        data.getDate()
                    ).padStart(2, "0");
                const dataFormatada =
                    `${ano}-${mes}-${dia}`;
                const registrosDoDia =
                    historicoMusculacao.filter(
                        item =>
                            item.data ===
                            dataFormatada
                    );
                if (
                    registrosDoDia.length === 0
                ) {
                    const linha =
                        document.createElement("tr");
                    linha.innerHTML = `
                        <td>
                            ${formatarData(dataFormatada)}
                        </td>
                        <td colspan="5">
                            Nenhum treino registrado
                        </td>
                    `;
                    historicoMusculacaoBody
                        .appendChild(linha);

                    continue;
                }
                registrosDoDia.forEach(
                    registro => {
                        const linha =
                            document.createElement(
                                "tr"
                            );
                        linha.innerHTML = `
                            <td>
                                ${formatarData(
                            registro.data
                        )}
                            </td>
                            <td>
                                ${registro.exercicio}
                            </td>
                            <td>
                                ${registro.carga} kg
                            </td>
                            <td>
                                ${registro.series}
                            </td>
                            <td>
                                ${registro.repeticoes}
                            </td>
                            <td>
                                ${registro.cardio} min
                            </td>
                        `;
                        historicoMusculacaoBody
                            .appendChild(linha);
                    }
                );
            }
        }
        document.getElementById(
            "dataTreino"
        ).value = obterDataHoje();
        atualizarHistorico();
    </script>
</body>
</html>
